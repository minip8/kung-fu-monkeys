name: CI

# A change of Markdown alone (CLAUDE.md, docs/, .claude/rules/, READMEs) starts no run:
# nothing builds from those files and no test reads them. A pull request with any other
# file runs everything. If a status check ever becomes required on main, a Markdown-only
# pull request would wait on it forever: drop this filter then.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CMake presets use VCPKG_ROOT; run-vcpkg checks vcpkg out at the manifest's
  # builtin-baseline so every job resolves the same dependency versions.
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Headers SDL3 3.4.18 needs on Linux for the features we build (vcpkg sdl3
  # with x11 + wayland, and the identical FetchContent configuration in
  # cmake/KfmDependencies.cmake): X11 + Xext (+ Xft, which the port asks
  # for), Wayland client + xkbcommon + EGL, ALSA for audio (dlopened at run
  # time; the runners have no sound card, so the client stays silent), and
  # pkg-config to find them. Everything else SDL can use (ibus, dbus, pulse,
  # pipewire, udev, kmsdrm, libdecor, the X extensions) is switched off on
  # both paths, so it is not installed. GL needs no headers:
  # the GL loader is vendored (third_party/glad).
  KFM_SDL_APT_PACKAGES: >-
    pkg-config libx11-dev libxext-dev libxft-dev
    libwayland-dev libxkbcommon-dev libegl-dev wayland-protocols libasound2-dev
  # The WebRTC transport (kfm_net_webrtc, architecture §6.4) on the
  # FetchContent path (no vcpkg: the lint job's compile database, local
  # builds): libdatachannel 0.24.6 links the system OpenSSL for DTLS and the
  # WebSocket client/server. With vcpkg (native and ASan jobs, Windows,
  # macOS) the manifest builds openssl itself and this is unused.
  KFM_NET_APT_PACKAGES: >-
    libssl-dev
  # Host tools the vcpkg Linux jobs need for ports built with autotools: the
  # `alsa` port behind sdl3's `alsa` feature (architecture §7, v0.19) runs
  # autoreconf. The FetchContent path uses the system libasound2-dev instead.
  KFM_VCPKG_APT_PACKAGES: >-
    autoconf autoconf-archive automake libtool

jobs:
  lint:
    name: format, tidy, sim-no-float
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install clang-format and clang-tidy
        run: pipx install clang-format==23.1.3 && pipx install clang-tidy==23.1.4
      - name: Install SDL3 and WebRTC build dependencies
        run: sudo apt-get update && sudo apt-get install -y $KFM_SDL_APT_PACKAGES $KFM_NET_APT_PACKAGES
      - name: clang-format
        # third_party/ (generated glad loader, sokol impl TU) is outside this set.
        run: |
          files=$(find engine apps tests tools -name '*.cpp' -o -name '*.hpp' | grep -v sin_table)
          clang-format --dry-run --Werror $files
      - name: No floating point in engine/sim
        run: tools/ci/check_sim_no_float.sh
      - name: Configure (compile database)
        run: cmake --preset dev -DKFM_USE_VCPKG=OFF
      - name: clang-tidy
        # One clang-tidy per core over batches of six files (the single process
        # this replaced took nine minutes). Each batch prints its diagnostics
        # in one piece; xargs exits non-zero when any batch does.
        run: |
          find engine apps tests -name '*.cpp' -print0 \
            | xargs -0 -n 6 -P "$(nproc)" sh -c '
                out=$(clang-tidy -p build/dev --quiet "$@" 2>&1); rc=$?
                [ -n "$out" ] && printf "%s\n" "$out"
                exit $rc' _

  native:
    name: ${{ matrix.name }} ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
        name: [linux-gcc, linux-clang, windows-msvc, macos-appleclang]
        # `name` is a base axis so each include merges into exactly the
        # combinations it names; includes without a base key all merge into
        # every combination and the last one wins.
        include:
          # Linux runs on 26.04: the C++23 baseline needs GCC >= 15 / Clang >= 19
          # (architecture §9), which ubuntu-latest (24.04) does not ship.
          - { name: linux-gcc,        os: ubuntu-26.04,   cc: gcc,   cxx: g++ }
          - { name: linux-clang,      os: ubuntu-26.04,   cc: clang, cxx: clang++ }
          - { name: windows-msvc,     os: windows-latest }
          # macOS names its compilers explicitly: the job exports CC/CXX from these
          # keys, and an empty CC reaches OpenSSL's Configure (built by vcpkg for
          # libdatachannel), which takes it literally and runs "" -fPIC ... .
          - { name: macos-appleclang, os: macos-latest,  cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install SDL3 build dependencies and the client smoke-test display
        if: runner.os == 'Linux'
        # xvfb + Mesa (llvmpipe) let ctest run `client_smoke`: kfm_client renders
        # 60 frames of a bot match on a virtual X server (registered only when
        # xvfb-run exists).
        run: |
          sudo apt-get update
          sudo apt-get install -y $KFM_SDL_APT_PACKAGES $KFM_NET_APT_PACKAGES $KFM_VCPKG_APT_PACKAGES xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri libegl-mesa0
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
      # vcpkg's binary cache (architecture §9, v0.77). run-vcpkg points vcpkg at
      # the `x-gha` backend, which vcpkg has removed, so every port was built
      # from source on every run (OpenSSL alone: three minutes). A `files`
      # cache under the workspace, kept by actions/cache, replaces it. Written
      # to GITHUB_ENV after run-vcpkg so it is the value Configure sees.
      - name: Point vcpkg at a file binary cache
        shell: bash
        run: |
          mkdir -p .vcpkg-bincache
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite" >> "$GITHUB_ENV"
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-bincache
          # No exact key: the newest cache of this toolchain (Debug and
          # Release build the same packages, so they share it).
          key: vcpkg-bin-${{ matrix.name }}-
          restore-keys: vcpkg-bin-${{ matrix.name }}-
      - name: Configure
        run: cmake --preset ${{ matrix.build == 'Debug' && 'dev' || 'release' }}
      - name: Save the vcpkg binary cache
        # Keyed by its contents, so it is saved only when Configure built a
        # package the restored cache did not have (also after a failed
        # Configure: what it did build is still good).
        if: >-
          always() && hashFiles('.vcpkg-bincache/**') != ''
          && steps.vcpkg-cache.outputs.cache-matched-key
             != format('vcpkg-bin-{0}-{1}', matrix.name, hashFiles('.vcpkg-bincache/**'))
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-bincache
          key: vcpkg-bin-${{ matrix.name }}-${{ hashFiles('.vcpkg-bincache/**') }}
      - name: Build (engine, kfm_replay, kfm_client, tests)
        run: cmake --build --preset ${{ matrix.build == 'Debug' && 'dev' || 'release' }}
      - name: Test (unit + determinism gate, client smoke on Linux)
        # Four at a time, the xvfb ones one at a time (RESOURCE_LOCK), as their
        # CMake says; then the real-socket tests (label network) alone, a
        # failing one run again up to three attempts (tools/ci/ctest_gate.sh,
        # architecture §9 v0.85). Nothing else is retried.
        shell: bash
        run: tools/ci/ctest_gate.sh ${{ matrix.build == 'Debug' && 'dev' || 'release' }}

  server-headless:
    # The dedicated server's build (architecture §13.5): KFM_HEADLESS=ON, so no
    # SDL, GL or ImGui; kfm_server, kfm_netsim and every headless test,
    # including the soak gates (label soak) and the real-socket WebRTC tests
    # (label network, 127.0.0.1 only). Dependencies come from FetchContent at
    # their pinned versions, with the system OpenSSL, as on a lean build host.
    name: linux-gcc server-headless Release
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install WebRTC build dependencies
        run: sudo apt-get update && sudo apt-get install -y $KFM_NET_APT_PACKAGES
      - name: Configure
        run: cmake --preset server-headless -DKFM_USE_VCPKG=OFF
      - name: Build (kfm_server, kfm_netsim, tests)
        run: cmake --build --preset server-headless
      - name: Check the dedicated server was produced
        run: build/server-headless/apps/server/kfm_server --help
      - name: Test (unit, netcode soaks, network, determinism gate)
        run: tools/ci/ctest_gate.sh server-headless

  wasm:
    name: wasm (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: cmake --preset wasm
      - name: Build (includes kfm_client.html + .js + .wasm)
        run: cmake --build --preset wasm
      - name: Check the browser client was produced
        run: ls -l build/wasm/apps/client/kfm_client.html build/wasm/apps/client/kfm_client.js build/wasm/apps/client/kfm_client.wasm
      - name: Test (unit + determinism gate under node)
        run: ctest --preset wasm --parallel 4

  asan:
    name: linux-gcc ASan+UBSan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install SDL3 and WebRTC build dependencies
        run: sudo apt-get update && sudo apt-get install -y $KFM_SDL_APT_PACKAGES $KFM_NET_APT_PACKAGES $KFM_VCPKG_APT_PACKAGES
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
      # The vcpkg binary cache, as in the native legs: the packages are
      # linux-gcc's (the sanitizers are this project's flags, not the ports').
      - name: Point vcpkg at a file binary cache
        shell: bash
        run: |
          mkdir -p .vcpkg-bincache
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite" >> "$GITHUB_ENV"
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-bincache
          # No exact key: the newest cache of this toolchain (Debug and
          # Release build the same packages, so they share it).
          key: vcpkg-bin-linux-gcc-
          restore-keys: vcpkg-bin-linux-gcc-
      - name: Configure
        run: cmake --preset asan
      - name: Save the vcpkg binary cache
        # Keyed by its contents, so it is saved only when Configure built a
        # package the restored cache did not have (also after a failed
        # Configure: what it did build is still good).
        if: >-
          always() && hashFiles('.vcpkg-bincache/**') != ''
          && steps.vcpkg-cache.outputs.cache-matched-key
             != format('vcpkg-bin-{0}-{1}', 'linux-gcc', hashFiles('.vcpkg-bincache/**'))
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-bincache
          key: vcpkg-bin-linux-gcc-${{ hashFiles('.vcpkg-bincache/**') }}
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        # The sanitizers make this the slowest test run by far (eleven minutes
        # one at a time), and four at a time each test runs over twice as slow
        # on the runner, so this leg leaves out what another leg covers: the
        # netsim soak gates (label soak) are run by server-headless Release,
        # and the same NetServer/NetClient code runs here in kfm_netcode_tests.
        # The real-socket tests are retried as on every leg (ctest_gate.sh).
        run: tools/ci/ctest_gate.sh asan soak

  lobby:
    name: lobby (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/lobby
      - name: Format
        run: cargo fmt --check --manifest-path services/lobby/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path services/lobby/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path services/lobby/Cargo.toml --locked
