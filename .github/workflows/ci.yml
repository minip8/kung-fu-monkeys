name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CMake presets use VCPKG_ROOT; run-vcpkg checks vcpkg out at the manifest's
  # builtin-baseline so every job resolves the same dependency versions.
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Headers SDL3 3.4.18 needs on Linux for the features we build (vcpkg sdl3
  # with x11 + wayland, and the identical FetchContent configuration in
  # cmake/KfmDependencies.cmake): X11 + Xext (+ Xft, which the port asks
  # for), Wayland client + xkbcommon + EGL, and pkg-config to find them.
  # Everything else SDL can use (ibus, dbus, alsa, pulse, pipewire, udev,
  # kmsdrm, libdecor, the X extensions) is switched off on both paths, so it
  # is not installed. GL needs no headers:
  # the GL loader is vendored (third_party/glad).
  KFM_SDL_APT_PACKAGES: >-
    pkg-config libx11-dev libxext-dev libxft-dev
    libwayland-dev libxkbcommon-dev libegl-dev wayland-protocols
  # The WebRTC transport (kfm_net_webrtc, architecture §6.4) on the
  # FetchContent path (no vcpkg: the lint job's compile database, local
  # builds): libdatachannel 0.24.6 links the system OpenSSL for DTLS and the
  # WebSocket client/server. With vcpkg (native and ASan jobs, Windows,
  # macOS) the manifest builds openssl itself and this is unused.
  KFM_NET_APT_PACKAGES: >-
    libssl-dev

jobs:
  lint:
    name: format, tidy, sim-no-float
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install clang-format and clang-tidy
        run: pipx install clang-format==19.1.7 && pipx install clang-tidy==19.1.0.1
      - name: Install SDL3 and WebRTC build dependencies
        run: sudo apt-get update && sudo apt-get install -y $KFM_SDL_APT_PACKAGES $KFM_NET_APT_PACKAGES
      - name: clang-format
        # third_party/ (generated glad loader, sokol impl TU) is outside this set.
        run: |
          files=$(find engine apps tests tools -name '*.cpp' -o -name '*.hpp' | grep -v sin_table)
          clang-format --dry-run --Werror $files
      - name: No floating point in engine/sim
        run: tools/ci/check_sim_no_float.sh
      - name: Configure (compile database)
        run: cmake --preset dev -DKFM_USE_VCPKG=OFF
      - name: clang-tidy
        run: clang-tidy -p build/dev --quiet $(find engine apps tests -name '*.cpp')

  native:
    name: ${{ matrix.name }} ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
        name: [linux-gcc, linux-clang, windows-msvc, macos-appleclang]
        # `name` is a base axis so each include merges into exactly the
        # combinations it names; includes without a base key all merge into
        # every combination and the last one wins.
        include:
          # Linux runs on 26.04: the C++23 baseline needs GCC >= 14 / Clang >= 19
          # (architecture §9), which ubuntu-latest (24.04) does not ship.
          - { name: linux-gcc,        os: ubuntu-26.04,   cc: gcc,   cxx: g++ }
          - { name: linux-clang,      os: ubuntu-26.04,   cc: clang, cxx: clang++ }
          - { name: windows-msvc,     os: windows-latest }
          - { name: macos-appleclang, os: macos-latest }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install SDL3 build dependencies and the client smoke-test display
        if: runner.os == 'Linux'
        # xvfb + Mesa (llvmpipe) let ctest run `client_smoke`: kfm_client renders
        # 60 frames of a bot match on a virtual X server (registered only when
        # xvfb-run exists).
        run: |
          sudo apt-get update
          sudo apt-get install -y $KFM_SDL_APT_PACKAGES $KFM_NET_APT_PACKAGES xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri libegl-mesa0
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
      - name: Configure
        run: cmake --preset ${{ matrix.build == 'Debug' && 'dev' || 'release' }}
      - name: Build (engine, kfm_replay, kfm_client, tests)
        run: cmake --build --preset ${{ matrix.build == 'Debug' && 'dev' || 'release' }}
      - name: Test (unit + determinism gate, client smoke on Linux)
        run: ctest --preset ${{ matrix.build == 'Debug' && 'dev' || 'release' }}

  wasm:
    name: wasm (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: cmake --preset wasm
      - name: Build (includes kfm_client.html + .js + .wasm)
        run: cmake --build --preset wasm
      - name: Check the browser client was produced
        run: ls -l build/wasm/apps/client/kfm_client.html build/wasm/apps/client/kfm_client.js build/wasm/apps/client/kfm_client.wasm
      - name: Test (unit + determinism gate under node)
        run: ctest --preset wasm

  asan:
    name: linux-gcc ASan+UBSan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install SDL3 and WebRTC build dependencies
        run: sudo apt-get update && sudo apt-get install -y $KFM_SDL_APT_PACKAGES $KFM_NET_APT_PACKAGES
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan
