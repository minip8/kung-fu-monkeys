name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CMake presets use VCPKG_ROOT; run-vcpkg checks vcpkg out at the manifest's
  # builtin-baseline so every job resolves the same dependency versions.
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  lint:
    name: format, tidy, sim-no-float
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install clang-format and clang-tidy
        run: pipx install clang-format==19.1.7 && pipx install clang-tidy==19.1.0.1
      - name: clang-format
        run: |
          files=$(find engine apps tests tools -name '*.cpp' -o -name '*.hpp' | grep -v sin_table)
          clang-format --dry-run --Werror $files
      - name: No floating point in engine/sim
        run: tools/ci/check_sim_no_float.sh
      - name: Configure (compile database)
        run: cmake --preset dev -DKFM_USE_VCPKG=OFF
      - name: clang-tidy
        run: clang-tidy -p build/dev --quiet $(find engine apps tests -name '*.cpp')

  native:
    name: ${{ matrix.name }} ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
        name: [linux-gcc, linux-clang, windows-msvc, macos-appleclang]
        # `name` is a base axis so each include merges into exactly the
        # combinations it names; includes without a base key all merge into
        # every combination and the last one wins.
        include:
          # Linux runs on 26.04: the C++23 baseline needs GCC >= 14 / Clang >= 19
          # (architecture §9), which ubuntu-latest (24.04) does not ship.
          - { name: linux-gcc,        os: ubuntu-26.04,   cc: gcc,   cxx: g++ }
          - { name: linux-clang,      os: ubuntu-26.04,   cc: clang, cxx: clang++ }
          - { name: windows-msvc,     os: windows-latest }
          - { name: macos-appleclang, os: macos-latest }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
      - name: Configure
        run: cmake --preset ${{ matrix.build == 'Debug' && 'dev' || 'release' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build == 'Debug' && 'dev' || 'release' }}
      - name: Test (unit + determinism gate)
        run: ctest --preset ${{ matrix.build == 'Debug' && 'dev' || 'release' }}

  wasm:
    name: wasm (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: cmake --preset wasm
      - name: Build
        run: cmake --build --preset wasm
      - name: Test (unit + determinism gate under node)
        run: ctest --preset wasm

  asan:
    name: linux-gcc ASan+UBSan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan
