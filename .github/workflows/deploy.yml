name: Deploy

# The M6a release (architecture §13.5, v0.37; runbook in deploy/README.md):
# on a v* tag, the server and lobby images go to GHCR and the browser client
# to Cloudflare Pages (the page's custom domain is attached to the Pages
# project in the Cloudflare dashboard). A manual run from a branch pushes
# images tagged sha-<short> (no `latest`) and a Pages preview of that branch.
#
# On a tag the VMs are updated between the images and the page (the `vms`
# job): a client is refused when its build id differs from the server's, so
# the servers must answer the new build before the page serves it. The job
# ships deploy/vm to each VM over an IAP SSH tunnel and runs update.sh TAG,
# which drains (waits for the lobby to report no live room, up to 15 min)
# and restarts the pool one process at a time; VMs are taken in the order of
# KFM_VMS, so list the lobby VM last. It authenticates with Workload Identity
# Federation (no key in the repository; deploy/gcp/setup_deploy_identity.sh
# creates the pool, provider and service account and prints the variables).
# Without KFM_VMS the job is skipped and the VMs are updated by hand.
#
# Repository settings it reads:
#   variables  CF_PAGES_PROJECT  the Cloudflare Pages project name
#              KFM_LOBBY_URL     the lobby's wss:// URL, written into config.js
#              KFM_SENTRY_DSN    the browser's Sentry DSN (may be unset: Sentry off)
#              KFM_VMS           the VMs to update, "name:zone ..." lobby VM last
#                                (e.g. "kfm-us-1:us-east1-b kfm-eu-1:europe-west1-b")
#              GCP_PROJECT_ID    the GCP project of the VMs
#              GCP_WORKLOAD_IDENTITY_PROVIDER  the provider's full resource name
#              GCP_DEPLOY_SERVICE_ACCOUNT      the deploy service account's email
#   secrets    CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: kfm-server, dockerfile: deploy/Dockerfile.server }
          - { image: kfm-lobby,  dockerfile: deploy/Dockerfile.lobby }
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR names are lower case
          name="ghcr.io/$owner/${{ matrix.image }}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags="$name:$GITHUB_REF_NAME,$name:latest"
          else
            tags="$name:sha-${GITHUB_SHA::7}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  vms:
    name: update the VMs
    needs: images
    if: github.ref_type == 'tag' && vars.KFM_VMS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # the OIDC token Workload Identity Federation exchanges
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Ship deploy/vm and run update.sh on every VM
        env:
          KFM_VMS: ${{ vars.KFM_VMS }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # OS Login names the runner's user after the service account; the
          # key gcloud generates for this run is registered to its profile.
          ssh=(gcloud compute ssh --quiet --tunnel-through-iap
               --ssh-flag=-o --ssh-flag=ServerAliveInterval=30)
          for vm in $KFM_VMS; do
            name="${vm%%:*}"; zone="${vm#*:}"
            [[ -n "$name" && -n "$zone" && "$name" != "$zone" ]] \
              || { echo "::error::KFM_VMS entry '$vm' is not name:zone"; exit 1; }
            echo "::group::$name ($zone)"
            tar czf - --owner=0 --group=0 -C deploy vm \
              | "${ssh[@]}" "$name" --zone "$zone" --command \
                  'sudo rm -rf /opt/kfm-deploy/vm && sudo tar xzf - -C /opt/kfm-deploy'
            "${ssh[@]}" "$name" --zone "$zone" --command \
              "sudo /opt/kfm-deploy/vm/update.sh '$TAG'"
            echo "::endgroup::"
          done

  web:
    name: browser client to Cloudflare Pages
    needs: [images, vms]
    # Runs after the VMs (or at once when the vms job is skipped: a manual
    # run, or no KFM_VMS), never after a failed one.
    if: >-
      !cancelled() && needs.images.result == 'success'
      && (needs.vms.result == 'success' || needs.vms.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: cmake --preset wasm
      - name: Build kfm_client (html + js + wasm)
        run: cmake --build --preset wasm --target kfm_client
      - name: Assemble the site
        # kfm_client.js and .wasm keep their names from build to build, so they
        # go under assets/<content hash>/ and only that directory is cached as
        # immutable; the pages that reference them are revalidated every load.
        # Emscripten's loader fetches the .wasm next to the .js. The page is
        # served at / (room links are https://<host>/?room=CODE) and at
        # /kfm_client.html.
        env:
          KFM_LOBBY_URL: ${{ vars.KFM_LOBBY_URL }}
          KFM_SENTRY_DSN: ${{ vars.KFM_SENTRY_DSN }}
        run: |
          set -euo pipefail
          src=build/wasm/apps/client
          hash="$(cat "$src/kfm_client.js" "$src/kfm_client.wasm" | sha256sum | cut -c1-12)"
          rm -rf site && mkdir -p "site/assets/$hash"
          cp "$src/kfm_client.js" "$src/kfm_client.wasm" "site/assets/$hash/"
          # The Release shell is minified: src=kfm_client.js may be unquoted.
          sed -E "s#src=(\"?)kfm_client\.js#src=\1assets/$hash/kfm_client.js#" \
            "$src/kfm_client.html" > site/kfm_client.html
          grep -q "assets/$hash/kfm_client.js" site/kfm_client.html \
            || { echo "::error::no kfm_client.js script tag in kfm_client.html"; exit 1; }
          cp site/kfm_client.html site/index.html
          if [[ -z "$KFM_LOBBY_URL" ]]; then
            echo "::warning::repository variable KFM_LOBBY_URL is not set"
          fi
          printf 'window.KFM_CONFIG = { lobbyUrl: "%s", sentryDsn: "%s" };\n' \
            "$KFM_LOBBY_URL" "$KFM_SENTRY_DSN" > site/config.js
          cat > site/_headers << 'EOF'
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          /*.wasm
            Content-Type: application/wasm
          /
            Cache-Control: no-cache
          /*.html
            Cache-Control: no-cache
          /kfm_client
            Cache-Control: no-cache
          /config.js
            Cache-Control: no-cache
          EOF
          find site -type f | sort
          cat site/config.js
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=${{ github.ref_type == 'tag' && 'main' || github.ref_name }}
            --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
