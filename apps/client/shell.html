<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Kung Fu Monkeys</title>
  <style>
    /* v0.43: the client's palette (apps/client/ui_style.hpp): dark jungle green,
       banana yellow, cream. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #142418; }
    /* The canvas is the only layer over the page: no compositing layers above it (§6.8). */
    #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; border: 0; outline: none; }
    #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fad628;
              font: 700 28px system-ui, sans-serif; letter-spacing: 0.02em; text-shadow: 2px 2px 0 #000;
              pointer-events: none; text-align: center; }
    #status small { display: block; margin-top: 8px; color: #fff4d6; font-weight: 400; font-size: 15px; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Kung Fu Monkeys<small>Loading…</small></div>
  <!-- Deployment settings (M6a, architecture §13.5): the deploy workflow writes
       window.KFM_CONFIG = { lobbyUrl: "wss://...", sentryDsn: "" }; next to the
       page, the wasm build a default one. A missing file just does not run. -->
  <script src="config.js"></script>
  <script>
    // WebGL2 context attributes per architecture §6.8. Emscripten's
    // Module.webglContextAttributes is not consulted by SDL3's own
    // emscripten_webgl_create_context path, so the same attributes are also
    // merged into every canvas getContext('webgl2') call below.
    const kfmWebglAttributes = { desynchronized: true, powerPreference: 'high-performance', antialias: false };
    const canvas = document.getElementById('canvas');
    const originalGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, attributes) {
      if (type === 'webgl2') attributes = Object.assign({}, attributes || {}, kfmWebglAttributes);
      return originalGetContext.call(this, type, attributes);
    };
    // Keyboard goes to the canvas: focus it on load and on every click.
    canvas.addEventListener('mousedown', () => canvas.focus());
    window.addEventListener('load', () => canvas.focus());
    const statusElement = document.getElementById('status');
    // Command-line flags from the query string: ?autostart&bots=3&seed=7 runs
    // kfm_client --autostart --bots 3 --seed 7; ?bots=3&bot=easy picks the
    // reference bot's tier (easy, medium, hard; bot modules are native only
    // for now); network mode is
    // ?connect=ws://host:port (plus &token=T, &spectate, &stun=stun:host:port,
    // &players=N), the same --connect path as the native client.
    // ?nick=NAME is the name online (--nick, saved); without --autostart or a
    // network key the client opens on its main menu (v0.43).
    // Rooms (M6a): ?room=CODE joins a room, ?create (&region=us) creates one,
    // through the lobby at config.js's lobbyUrl unless the query names one:
    // for local development (tools/web/serve.py and the Rust lobby on 8080)
    //   kfm_client.html?lobby=ws://127.0.0.1:8080&create
    // and the room's invite is the same page with ?room=CODE (&lobby=...).
    const kfmConfig = window.KFM_CONFIG || {};
    const kfmQuery = new URLSearchParams(window.location.search);
    const kfmArguments = [];
    if (!kfmQuery.has('lobby') && kfmConfig.lobbyUrl) kfmArguments.push('--lobby', kfmConfig.lobbyUrl);
    for (const [key, value] of kfmQuery) {
      kfmArguments.push('--' + key);
      if (value !== '') kfmArguments.push(value);
    }
    // Error reports (M6a): only with a DSN in config.js; nothing loads without one.
    // The Sentry browser bundle is pinned (8.55.0, with its SRI hash).
    let kfmReport = () => {};
    if (kfmConfig.sentryDsn) {
      const sentry = document.createElement('script');
      sentry.src = 'https://browser.sentry-cdn.com/8.55.0/bundle.min.js';
      sentry.integrity = 'sha384-BlRl+vkcjdIA/AKRb8zWtiqlVVXepUsSv0+vho7ZMUTsNudEyQjGUKo9W86Hc1EC';
      sentry.crossOrigin = 'anonymous';
      sentry.onload = () => {
        window.Sentry.init({ dsn: kfmConfig.sentryDsn });
        kfmReport = (error) => window.Sentry.captureException(error);
      };
      document.head.appendChild(sentry);
    }
    var Module = {
      canvas: canvas,
      arguments: kfmArguments,
      webglContextAttributes: kfmWebglAttributes,
      print: (text) => console.log(text),
      printErr: (text) => console.error(text),
      setStatus: (text) => {
        statusElement.replaceChildren('Kung Fu Monkeys', Object.assign(document.createElement('small'), { textContent: text }));
        statusElement.hidden = !text;
      },
      onRuntimeInitialized: () => { statusElement.hidden = true; canvas.focus(); },
      onAbort: (what) => { kfmReport(new Error('wasm abort: ' + what)); },
    };
    window.onerror = (message, source, line, column, error) => {
      statusElement.hidden = false;
      statusElement.textContent = 'Error: see the browser console.';
      kfmReport(error || new Error(String(message)));
    };
    window.addEventListener('unhandledrejection', (event) => { kfmReport(event.reason); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
