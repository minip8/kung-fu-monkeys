# v0.91: a walled compound, 48 x 27 units (architecture §5.10). Each wing holds
# four rooms (two columns, north and south) behind walls with doorways, and a
# hall runs north to south through the middle round a central block. Ten
# spawn points, one in each room and two in the hall, at least 10 units
# apart, each pair of neighbours with a wall between them: shots go through
# the doorways or bank off the walls. A team arena: spawn_groups = 2, the
# west wing and the north of the hall against the east wing and the south,
# the same turned half a turn (the hall's two pillars too).
