# v0.91, the first of the large free-for-all arenas (architecture §5.10): 44 x
# 25 units of open ground, about 1.9 times the dojo's area. Ten spawn points
# on three staggered rows (three, four, three) at least 10 units apart, the
# reach of a throw, and a block of cover on the line between every pair of
# neighbours, so no throw made on the first tick reaches anyone: the blocks
# fall into rows of posts with a rock in the middle. Symmetric in both axes.
# Keys as in content/arenas.toml and arenas/01-pillars.toml.
[[arena]]
name = "meadow"
half_extents = [22, 12.5]
spawn_points = [
  [-12, 8], [0, 8], [12, 8], [-18, 0], [-6, 0], [6, 0], [18, 0], [-12, -8], [0, -8], [12, -8],
]
walls = [
  { min = [-1.5, -1.5], max = [1.5, 1.5] },
  { min = [-7, 7], max = [-5, 9] },
  { min = [5, 7], max = [7, 9] },
  { min = [-7, -9], max = [-5, -7] },
  { min = [5, -9], max = [7, -7] },
  { min = [-13, -1], max = [-11, 1] },
  { min = [11, -1], max = [13, 1] },
  { min = [-16, 3], max = [-14, 5] },
  { min = [14, 3], max = [16, 5] },
  { min = [-16, -5], max = [-14, -3] },
  { min = [14, -5], max = [16, -3] },
  { min = [-10, 3], max = [-8, 5] },
  { min = [8, 3], max = [10, 5] },
  { min = [-10, -5], max = [-8, -3] },
  { min = [8, -5], max = [10, -3] },
  { min = [-4, 3], max = [-2, 5] },
  { min = [2, 3], max = [4, 5] },
  { min = [-4, -5], max = [-2, -3] },
  { min = [2, -5], max = [4, -3] },
]
