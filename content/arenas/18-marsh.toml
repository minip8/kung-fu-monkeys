# v0.91, the largest arena: 60 x 34 units of marsh (architecture §5.10), about
# 3.5 times the dojo's area. Ten spawn points on three staggered rows at
# least 13.6 units apart (beyond a throw's reach), cover on every diagonal
# between rows, mud (half speed) in the corners, beside the north and south
# spawns and in the middle, and four power-up spawners on the open ground
# between them, so a round brings the monkeys together for the pickups.
# Symmetric in both axes.
[[arena]]
name = "marsh"
half_extents = [30, 17]
spawn_points = [
  [-16, 11], [0, 11], [16, 11], [-24, 0], [-8, 0], [8, 0], [24, 0], [-16, -11], [0, -11], [16, -11],
]
