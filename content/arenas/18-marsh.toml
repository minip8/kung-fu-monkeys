  { min = [-21, 4.5], max = [-19, 6.5] },
  { min = [19, 4.5], max = [21, 6.5] },
  { min = [-21, -6.5], max = [-19, -4.5] },
  { min = [19, -6.5], max = [21, -4.5] },
  { min = [-13, 4.5], max = [-11, 6.5] },
  { min = [11, 4.5], max = [13, 6.5] },
  { min = [-13, -6.5], max = [-11, -4.5] },
  { min = [11, -6.5], max = [13, -4.5] },
  { min = [-5, 4.5], max = [-3, 6.5] },
  { min = [3, 4.5], max = [5, 6.5] },
  { min = [-5, -6.5], max = [-3, -4.5] },
  { min = [3, -6.5], max = [5, -4.5] },
