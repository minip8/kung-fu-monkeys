# Abilities (architecture §5.5). Each [[ability]] is one AbilityDef; the
# player's loadout (player.toml) refers to them by name. Index 0 is the
# built-in inert "none" ability, so the first entry here is index 1. Indices
# are part of the content hash: append new abilities, never reorder.
#
# Units: durations in ticks (60 per second), speeds in arena units per
# second (the loader divides by 60 and truncates toward zero, like
# Fixed::fromRatio). Every key but name and kind is optional (0 / empty).
#
# Keys: name, kind (dash | throw | blink | slam | parry | call), cooldown_ticks, startup_ticks,
# active_ticks, recovery_ticks, perfect_window_ticks, speed, param0, param1,
# range (v0.35, a call's only: param0 under its own name, in units),
# charge_min, charge_max, charge_ticks (v0.48, a throw's only, all three or
# none: hold to charge, below),
# tags_startup, tags_active, tags_recovery (lists of tag names: dashing,
# perfect_dash, hit_stun, shielded, invulnerable, eliminated, slamming, parrying),
# root_phases (v0.34: a list of startup, active, recovery: while one of them
# runs the stick does not move the monkey, and on the grid it takes no cell
# at a turn's latch; none by default).

[[ability]]
name = "dash"
kind = "dash"
cooldown_ticks = 45         # 0.75 s from press to the next dash
startup_ticks = 0           # must stay 0: PerfectDash is granted from the press tick
active_ticks = 12           # 0.2 s of dash movement
recovery_ticks = 6          # 0.1 s before the stick moves the monkey again
perfect_window_ticks = 4    # first 4 active ticks catch a banana (plus the press sub-tick)
speed = 22                  # units/s while active: 4.4 units per dash
tags_active = ["dashing"]

# v0.48, the charged throw: the wind-up lasts while the button is held and
# the banana leaves on the release, along the aim of that tick. Its speed is
# the boomerang's times charge_min for a tap, rising evenly to charge_max over
# charge_ticks held past the startup (then it stays there); the outbound time
# is fixed, so the reach scales with it: at 16 units/s and 36 outbound ticks,
# a tap flies 5.8 units out and a full charge 14.4.
[[ability]]
name = "throw"
kind = "throw"
cooldown_ticks = 20         # a third of a second between throws (from the press)
startup_ticks = 2           # wind-up before the banana can leave the hand
active_ticks = 1            # the banana spawns on the Startup -> Active transition
recovery_ticks = 6          # follow-through
charge_min = 0.6            # a tap: 9.6 units/s
charge_max = 1.5            # full charge: 24 units/s
charge_ticks = 40           # 2/3 s held past the startup to full charge

# Fast Hands (powerups.toml) runs the throw slot on this def while it lasts.
[[ability]]
name = "throw_fast"
kind = "throw"
cooldown_ticks = 8          # a banana every 8 ticks while the hands are fast
startup_ticks = 1
active_ticks = 1
recovery_ticks = 3
charge_min = 0.6
charge_max = 1.5
charge_ticks = 20           # fast hands charge twice as fast

# Blink (v0.21): a teleport dash. After a short telegraph the monkey jumps
# speed x active_ticks along its stick (or facing), stopped by walls; nothing
# on the path is touched. No tags: a banana still hits during the startup.
[[ability]]
name = "blink"
kind = "blink"
cooldown_ticks = 90         # 1.5 s from press to the next blink
startup_ticks = 6           # 0.1 s telegraph before the jump
active_ticks = 10           # the jump: speed x active_ticks = 5 units
recovery_ticks = 6
speed = 30                  # units/s over the active ticks

# Slam (v0.21): a jump, then a shockwave on the first active tick. Within
# param0 of the slammer's centre, monkeys are pushed param1 units away over
# active_ticks and bananas in flight (not its own) drop to the ground.
[[ability]]
name = "slam"
kind = "slam"
cooldown_ticks = 120        # 2 s from press to the next slam
startup_ticks = 12          # 0.2 s in the air: the telegraph
active_ticks = 12           # the push lasts 0.2 s
recovery_ticks = 12         # landing lag
param0 = 3                  # reach: 3 units from the slammer's centre
param1 = 4                  # push: 4 units away from the slammer

# Parry (v0.21): a short timed window. A banana that is not the parrier's,
# reaching it within [press + startup, press + startup + active) (judged to
# the sub-tick), flies back at its thrower as the parrier's own banana.
# Mistimed, the banana hits as usual.
[[ability]]
name = "parry"
kind = "parry"
cooldown_ticks = 60         # 1 s from press to the next parry
startup_ticks = 2           # the guard comes up
active_ticks = 8            # 0.13 s window
recovery_ticks = 14         # a whiff leaves the monkey open

# v0.34, the grid space (architecture §5.12): monkeys move a cell per turn
# (turn_ticks in modes.toml), so these defs count in turns. On the grid a
# dash slides dash_cells cells (the mode's) over its active ticks; its speed
# is never read there and is written as the same distance per second for
# readers. Timings below are for 15-tick turns (grid_rounds); the _1t
# defs are the same game at 1-tick turns (grid_rounds_1t).
#
# The base grid dash: two cells over one turn, a 3-turn cooldown and a
# perfect window of 0, so it never catches (row 10 never matches).
[[ability]]
name = "grid_dash"
kind = "dash"
cooldown_ticks = 45         # 3 turns
active_ticks = 15           # the slide takes one turn, Dashing throughout
perfect_window_ticks = 0    # never PerfectDash: a bot's timing would make every catch free
speed = 8                   # 2 cells per 15 ticks (unused on the grid)
tags_active = ["dashing"]

# The catcher's dash (loadout catcher, one monkey per team by role): the
# window spans the whole active phase, the cooldown is 4 turns. Scarcity,
# not timing, balances the catch.
[[ability]]
name = "catcher_dash"
kind = "dash"
cooldown_ticks = 60         # 4 turns
active_ticks = 15
perfect_window_ticks = 15   # the whole slide catches
speed = 8
tags_active = ["dashing"]

# The grid throw roots through its recovery, one turn long, so the latch
# after a throw takes no step: a turn is move or throw. A walk already
# committed at the throw's latch finishes.
[[ability]]
name = "grid_throw"
kind = "throw"
cooldown_ticks = 15         # 1 turn
startup_ticks = 2
active_ticks = 1
recovery_ticks = 15         # = turn_ticks: exactly one latch falls inside it
root_phases = ["recovery"]

# Quick Hands (powerups.toml) runs the throw slot on this unrooted def: the
# only way to move and throw in one turn. Shared by both turn lengths.
[[ability]]
name = "quick_throw"
kind = "throw"
cooldown_ticks = 1
active_ticks = 1

# The same kit at 1-tick turns (grid_rounds_1t, bot matches).
[[ability]]
name = "grid_dash_1t"
kind = "dash"
cooldown_ticks = 3          # 3 turns
active_ticks = 1            # two cells in one turn
perfect_window_ticks = 0
speed = 120                 # 2 cells per tick (unused on the grid)
tags_active = ["dashing"]

[[ability]]
name = "catcher_dash_1t"
kind = "dash"
cooldown_ticks = 4          # 4 turns
active_ticks = 1
perfect_window_ticks = 1    # the whole active phase
speed = 120
tags_active = ["dashing"]

[[ability]]
name = "grid_throw_1t"
kind = "throw"
cooldown_ticks = 1
active_ticks = 1            # no startup: the banana leaves on the press tick
recovery_ticks = 1          # = turn_ticks
root_phases = ["recovery"]

# v0.35, the squad contest (architecture §8): a call shouts the press tick's
# aim byte, one of 256 symbols, to every monkey (ally or enemy) whose centre
# is within `range` units, Chebyshev (the larger of |dx| and |dy|). On a grid
# arena the range in cells is the author's arithmetic: cells x the arena's
# cell size (courtyard: 1.0, so 4 units = 4 cells, the grid modes' cone).
# The sim only emits MonkeyCalled; the bots' hosts fold what each monkey
# heard into its observation (docs/bot-abi.md). One call per turn.
[[ability]]
name = "grid_call"
kind = "call"
cooldown_ticks = 15         # 1 turn
range = 4

[[ability]]
name = "grid_call_1t"
kind = "call"
cooldown_ticks = 1          # 1 turn
range = 4
