# Modes (ModeDef, architecture §5.3, §5.10). A match picks one by index
# (MatchConfig::mode); command lines and the lobby use the name. The first
# mode loaded is index 0, the default. Indices go into replay headers and are
# part of the content hash: append new modes, never reorder.
#
# Keys: name (lowercase, up to 15 of a-z 0-9 _ -), kind, and the numbers the
# kind reads (a kind ignores the others). Durations in ticks (60 per second).
#   kind                 rounds (default), deathmatch, survival, team_rounds,
#                        team_deathmatch, hill, capture, control or harvest
#   round_start_ticks    all kinds: countdown with everyone spawned and frozen
#   round_end_ticks      rounds, survival, team_rounds: pause after a round
#                        before the next one (the round's scoreboard); the
#                        clock kinds end the match without a pause and
#                        never read it (kept equal for the Observation)
#   rounds_to_win        rounds, survival: round wins that take the match
#   time_limit_ticks     deathmatch: length of the match; survival: of each
#                        round; 0 = no clock
#   score_to_win         the point kinds: points that win (at least 1, at most
#                        127; deathmatch: eliminations plus catch_score and
#                        suicide_score points)
#   respawn_ticks        the respawning kinds: from an elimination to the
#                        respawn (>= 1), the same for every cause of death
#   respawn_invuln_ticks deathmatch: spawn protection after a respawn
#   dry_round_ticks      rounds, survival, team_rounds (v0.57): a round with no
#                        banana left anywhere ends as its clock-out would, at
#                        once on an arena without pits, after this many dry
#                        ticks on one with pits (default 180, 3 s)
#   death_bananas        v0.57: what a death does to the monkey's bananas:
#                        "drop" (default: the ones in flight come down where
#                        they are, the held ones scatter around it) or
#                        "vanish" (every one it owns, held or in flight, goes
#                        with it; the respawn hands out the starting banana).
#                        A pit fall always takes the held ones down; the ones
#                        in flight follow this key from the fall's start
#   catch_score          v0.57, deathmatch, team_deathmatch, hill, capture,
#                        control, harvest:
#                        points for a perfect dash catch of an enemy's banana
#                        (the own one or an ally's scores nothing; default 0)
#   suicide_score        v0.57, the same kinds: points for an elimination with
#                        no killer (a pit fall; default 0). Negative takes the
#                        score below zero; score_to_win counts these points
#                        and a team's score is the sum of its slots'
#   banana_regrow_ticks  v0.57: a monkey owning no banana (none in its hand,
#                        none of its own in flight) for this many Playing
#                        ticks in a row grows one in its hand (0 = never, the
#                        default); the clock stops while it falls. A mode that
#                        regrows never runs dry
#   banana_outbound_ticks  v0.80, any kind: the ticks a banana flies out
#                        before it turns for home, 0 to 65535 (0, the
#                        default: [boomerang] outbound_ticks)
#   banana_turn_rate     v0.80, any kind: the most a returning banana turns
#                        per tick, in BAM (65536 a full turn), 0 to 32768 (0,
#                        the default: [boomerang] turn_rate_bam)
#   teams                0 = free-for-all (default), else 2 to 10 teams the
#                        hosts split the slots into, round-robin (the team
#                        kinds need it; such a mode plays only on an arena
#                        with at least that many spawn_groups)
#   baseline             a power-up name every monkey holds from its spawn
#                        on with no expiry (none by default); one granting
#                        tag "friendly_fire" lets allies hit each other
#   roles                team modes: up to 10 loadout names handed out by a
#                        slot's position within its team, round-robin
#                        (none: every slot plays the match's loadout)
#   hill_ticks           hill: ticks a team must hold the zone alone for a
#                        point (>= 1); a contested or empty zone holds the
#                        clock. Plays only on an arena with a zone; respawns
#                        and the clock as deathmatch, score_to_win counts
#                        points. Control (v0.80): the zone-ticks of a point
#                        (two owned zones score twice as fast)
#   flag_return_ticks    capture: ticks a dropped flag lies untouched before
#                        it goes home (>= 1). Team t's flag starts in zone t,
#                        so it plays only on an arena with a zone per team;
#                        score_to_win counts captures
#   capture_ticks        v0.80, control: every zone of the arena has an owner
#                        (nobody at the start); the team with strictly the
#                        most monkeys in a zone it does not own captures it
#                        after this many ticks of that (>= 1, default 60; a
#                        new challenger starts from zero, a tie holds the
#                        progress, the owner with the most or an empty zone
#                        clears it). An owned zone pays its team one tick a
#                        tick whether or not anyone stands on it, and
#                        hill_ticks of them score a point (to the team's
#                        lowest present slot). At most 4 teams; plays only on
#                        an arena with a zone; respawns and the clock as
#                        deathmatch, score_to_win counts points
#   respawn_ammo         v0.82, the respawning kinds: the bananas a respawned
#                        monkey holds, 0 to 254, capped at its ammo_max
#                        (absent, the default: [player] ammo_start, as every
#                        mode before v0.82). A round start's spawn always
#                        holds ammo_start
#   bank_ticks           v0.82, harvest: team t's home is zone t. On every
#                        Playing tick that is a multiple of this (>= 1,
#                        default 2) each living monkey in its own home with a
#                        banana in hand banks one: a banana fewer in its hand,
#                        a point to it (whoever else stands there). A banked
#                        banana leaves the world. Plays only on an arena with
#                        a zone per team and at least one tree; respawns and
#                        the clock as deathmatch, score_to_win counts banked
#                        bananas, eliminations score nothing
#   steal_ticks          v0.82, harvest: on every Playing tick that is a
#                        multiple of this (0, the default: never) each living
#                        monkey with room in its hand standing in an enemy's
#                        home takes one banana back out, when that team's
#                        score is above zero and none of its living monkeys
#                        stands in the zone: the point comes off the team's
#                        highest-scoring slot (the lowest on a tie), the
#                        banana goes into the raider's hand (one a beat)
#   arenas               v0.82, optional: a pool of arena names (1 to 16, each
#                        once, every one suiting the mode; `arena`, when also
#                        given, must be one of them). kfm_arena cycles a pool;
#                        the other hosts pick one arena (`arena`, else the
#                        pool's first that suits the mode)
#   space                v0.34: how monkeys move, "continuous" (default, the
#                        stick) or "grid": a monkey at rest commits to one of
#                        its eight neighbouring cells at every turn's latch
#                        and slides there over the turn; bananas fly as in
#                        the continuous space. Plays only on an arena with
#                        cells (a tilemap, `cell`)
#   turn_ticks           grid: ticks of a turn, 1 to 60 (default 15)
#   dash_cells           grid: cells a dash commits to, 1 to 8 (default 2),
#                        sliding over the dash's active_ticks
#   arena                v0.34, optional: the arena a host picks for the mode
#                        when none is named (else the first that suits it)
#   vision               v0.35: what a bot sees (the observation builder's
#                        fog; humans always see everything), a table
#                        { kind, peripheral, cone, focus, hearing,
#                        banana_sight }. kind "all" (default: everything),
#                        "team" (the union of the allies' sight; team modes)
#                        or "own"; the rest are cells, Chebyshev: peripheral
#                        around the monkey whatever the facing, the cone
#                        within 45 degrees of the facing (eight directions)
#                        out to `cone` behind a clear line of sight, `focus`
#                        more cone for a monkey at rest, bananas in flight
#                        heard within `hearing` whatever the facing and the
#                        walls, cells around an own banana in flight within
#                        `banana_sight`. A fog kind plays only on an arena
#                        with cells
# The team kinds score per slot like their free-for-all twins; a team's
# score is the sum of its slots' (team_rounds: round wins; team_deathmatch:
# eliminations of enemies, ally kills score nothing).
# A mode does not carry a loadout: the kit is its own match axis since v0.31
# (content/loadouts.toml, --loadout NAME).

[[mode]]
name = "rounds"             # free-for-all rounds: last monkey standing scores
kind = "rounds"
rounds_to_win = 3           # first to three round wins takes the match
round_end_ticks = 180       # 3 s pause after a round before the next one
round_start_ticks = 60      # 1 s countdown with everyone spawned and frozen

[[mode]]
name = "deathmatch"         # eliminations score; the eliminated respawn
kind = "deathmatch"
score_to_win = 10           # first to ten points (eliminations and catches, less suicides)
time_limit_ticks = 10800    # else the leader after 3 minutes (a tied lead is a draw)
respawn_ticks = 120         # back in 2 s after an elimination
respawn_invuln_ticks = 90   # 1.5 s of spawn protection
death_bananas = "vanish"    # v0.57: a death takes its bananas along; the respawn hands one out
catch_score = 1             # a perfect catch of an enemy's banana scores
suicide_score = -1          # a pit fall costs a point (scores may go below zero)
round_start_ticks = 60
round_end_ticks = 180

[[mode]]
name = "survival"           # rounds on a clock: last monkey standing, or the
kind = "survival"           # healthiest (then fewest deaths) when time runs out
rounds_to_win = 3
time_limit_ticks = 3600     # 60 s per round
round_start_ticks = 60
round_end_ticks = 180

# v0.32: team modes (architecture §5.3). No baseline: allies' bananas, dash
# attacks and slam pushes pass through each other (no friendly fire).
[[mode]]
name = "team_rounds"        # last team standing wins the round
kind = "team_rounds"
teams = 2
rounds_to_win = 3           # the first team to three round wins
round_start_ticks = 60
round_end_ticks = 180

[[mode]]
name = "team_deathmatch"    # a team's eliminations to score_to_win
kind = "team_deathmatch"
teams = 2
score_to_win = 20           # the first team to twenty points
time_limit_ticks = 10800    # else the leading team after 3 minutes (a tie is a draw)
respawn_ticks = 120
respawn_invuln_ticks = 90
death_bananas = "vanish"
catch_score = 1
suicide_score = -1
round_start_ticks = 60
round_end_ticks = 180

# v0.33: objective modes (architecture §5.3), on arenas with zones.
[[mode]]
name = "hill"               # hold the zone alone: a point per hill_ticks
kind = "hill"
teams = 2
hill_ticks = 300            # 5 s alone on the hill scores a point
score_to_win = 5            # the first team to five points wins
time_limit_ticks = 10800    # else the leading team after 3 minutes (a tie is a draw)
respawn_ticks = 300         # v0.57: back in 5 s, whatever the cause (a regrow takes 8 s)
respawn_invuln_ticks = 90
death_bananas = "vanish"
banana_regrow_ticks = 480   # an empty hand grows a banana after 8 s
round_start_ticks = 60
round_end_ticks = 180

[[mode]]
name = "capture"            # carry the enemy flag home while your own is home
kind = "capture"
teams = 2
score_to_win = 3            # the first team to three captures wins
flag_return_ticks = 600     # a dropped flag left alone goes home after 10 s
time_limit_ticks = 10800    # else the leading team after 3 minutes (a tie is a draw)
respawn_ticks = 300
respawn_invuln_ticks = 90
death_bananas = "vanish"
banana_regrow_ticks = 480
round_start_ticks = 60
round_end_ticks = 180

# v0.34: the grid space (architecture §5.12). Team rounds on cells: a turn is
# 15 ticks (four a second) for human lobbies, a walk one cell per turn, a
# dash two cells in one turn, a throw costs the next turn (grid_throw roots
# its recovery). One catcher per team by role (the second monkey of a team
# gets the base grid kit, and so on round-robin). The baseline shrinks
# monkeys to 0.35 and bananas to 0.15 so the hit disc of 0.5 fits a cell,
# gives HP 2 and flies bananas at 2 cells per turn (powerups.toml).
[[mode]]
name = "grid_rounds"
kind = "team_rounds"
space = "grid"
turn_ticks = 15
dash_cells = 2
teams = 2
roles = ["catcher", "grid", "grid", "grid", "grid"]
baseline = "grid_base"
arena = "courtyard"
rounds_to_win = 3
round_start_ticks = 60
round_end_ticks = 180
# v0.35, the squad contest (architecture §8): each bot sees its own slice.
# The cone reaches 4 cells, two turns of banana flight and two thirds of the
# 6-cell throw; hearing is one turn of warning (2 cells per turn, plus 1).
vision = { kind = "own", peripheral = 1, cone = 4, focus = 1, hearing = 3, banana_sight = 1 }

# The same at 1-tick turns, for bot matches at full speed (kfm_arena): the
# _1t loadouts and baseline count the same turns in single ticks, except
# the bananas, which content cannot fly at 2 cells per tick (§12).
[[mode]]
name = "grid_rounds_1t"
kind = "team_rounds"
space = "grid"
turn_ticks = 1
dash_cells = 2
teams = 2
roles = ["catcher_1t", "grid_1t", "grid_1t", "grid_1t", "grid_1t"]
baseline = "grid_base_1t"
arena = "courtyard"
rounds_to_win = 3
round_start_ticks = 60
round_end_ticks = 180
# The same vision: at about a cell per turn the bananas give hearing three
# turns of warning here (§12).
vision = { kind = "own", peripheral = 1, cone = 4, focus = 1, hearing = 3, banana_sight = 1 }

# M7: the row the bot ladder points at (architecture §8 "The ladder"), the
# contest knobs in one place (team size, vision, the call range of the kits,
# turn_ticks, the arenas). A season changes this row, not the service, and
# the row may change between releases inside a season (v0.59). Since v0.82
# it is harvest (§11 "Contest design: bananas as the economy"): bananas are
# the resource as well as the ammunition. grid_rounds_1t's squad (1-tick
# turns, the roles, fog and calls) plays on a pool of four maps (grove,
# orchards, gorge, burrows; kfm_arena cycles it, the other hosts take grove),
# each its own half turn with a home zone per team (zone t is team t's) and
# trees that lay bananas: a home tree per team every 90 turns, holding one,
# flank trees every 60 holding two, rich trees every 30 holding three. The
# hand is the cargo, three bananas under harvest_base (contest_base with
# ammo_max + 2). Every 2 turns a monkey in its own home banks one banana for
# a point; every 6 a monkey with room in its hand, standing in the enemy's
# home with no defender there, takes one back out (the point comes off that
# team). First to 40 banked, else the leader at 3600 turns (a tied lead is a
# draw); eliminations and catches score nothing, because both already pay
# in bananas: a death drops the cargo where it falls, a perfect catch takes
# the enemy's banana, a pit takes the cargo down. Nothing else mints a
# banana: no regrow, and a respawn (240 turns, then 8 of protection) comes
# back empty-handed, to rearm at its home tree. The banana flies as in
# control_1t below: 3 turns out at 2 cells a turn, home at up to 85 degrees
# a turn, back in about 5 turns; heard a cell away (hearing 1).
[[mode]]
name = "contest"
kind = "harvest"
space = "grid"
turn_ticks = 1
dash_cells = 2
teams = 2
roles = ["catcher_1t", "grid_1t", "grid_1t", "grid_1t", "grid_1t"]
baseline = "harvest_base"
arenas = ["grove", "orchards", "gorge", "burrows"]
arena = "grove"
bank_ticks = 2              # a banana banked every 2 turns in the own home
steal_ticks = 6             # one taken back out of an undefended enemy home every 6
score_to_win = 40           # the first team to forty banked bananas wins
time_limit_ticks = 3600     # else the leading team after 3600 turns (a tie is a draw)
respawn_ticks = 240
respawn_invuln_ticks = 8
respawn_ammo = 0            # a respawn comes back empty-handed
death_bananas = "drop"      # a death drops the cargo where it falls
catch_score = 0
banana_regrow_ticks = 0     # no regrow: the trees are the only supply
banana_outbound_ticks = 3   # 3 turns out at 2 cells a turn: 6 cells
banana_turn_rate = 15474    # BAM a turn on the way home: 85 degrees
round_start_ticks = 60
round_end_ticks = 180
vision = { kind = "own", peripheral = 1, cone = 4, focus = 1, hearing = 1, banana_sight = 1 }

# v0.80's contest, kept for the control kind (v0.82: appended under a new
# name when the contest became harvest, every number unchanged): capture and
# keep on the grid (§11 "Contest design"), grid_rounds_1t's squad under the
# control kind on courtyard_zones, three zones (the centre, then the west
# and east homes). The team with strictly the most monkeys in a zone it does
# not own captures it after 30 turns; an owned zone pays its team a tick of
# clock every turn whether or not anyone stands on it, and 60 of them score
# a point, so two zones score twice as fast. First to 10 points, else the
# leader at 3600 turns (a tied lead is a draw); eliminations score nothing.
# A monkey crosses the arena in 24 turns; a respawn takes 240, then 8 turns
# of protection. The baseline, contest_base, is grid_base_1t with the banana
# at 2 cells a turn. It flies out for 3 turns (6 cells of flight; the third
# turn already bends home, so it reaches about 5 cells from the thrower, the
# 1-cell spawn offset included) and turns for home at up to 85 degrees a
# turn, a U-turn about 2.3 cells wide, so a banana is back in about 5 turns.
# 85, not 90: at a right angle a returning banana on this axis-aligned map
# can square-orbit a pillar until max_return_ticks grounds it. A banana is
# heard only a cell away (hearing 1), so where a monkey looks decides what it
# can dodge.
[[mode]]
name = "control_1t"
kind = "control"
space = "grid"
turn_ticks = 1
dash_cells = 2
teams = 2
roles = ["catcher_1t", "grid_1t", "grid_1t", "grid_1t", "grid_1t"]
baseline = "contest_base"
arena = "courtyard_zones"
capture_ticks = 30          # 30 turns with the most monkeys in a zone takes it
hill_ticks = 60             # 60 turns of owned zone score a point
score_to_win = 10           # the first team to ten points wins
time_limit_ticks = 3600     # else the leading team after 3600 turns (a tie is a draw)
respawn_ticks = 240
respawn_invuln_ticks = 8
death_bananas = "vanish"
banana_regrow_ticks = 120   # an empty hand grows a banana after 120 turns
banana_outbound_ticks = 3   # 3 turns out at 2 cells a turn: 6 cells
banana_turn_rate = 15474    # BAM a turn on the way home: 85 degrees
round_start_ticks = 60
round_end_ticks = 180
vision = { kind = "own", peripheral = 1, cone = 4, focus = 1, hearing = 1, banana_sight = 1 }
