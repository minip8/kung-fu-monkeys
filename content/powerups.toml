# Power-ups (PowerUpDef, architecture §5.8). Arena spawners (see
# arenas/04-dojo_powerups.toml) drop them as pickups; a monkey that touches one
# gains its grants for duration_ticks. Indices go into the world state and
# are part of the content hash: append new power-ups, never reorder.
#
# Keys: name (lowercase, up to 15 of a-z 0-9 _ -), duration_ticks (>= 1, 60
# per second), color (palette index 0-9: 0 red, 1 blue, 2 yellow, 3 green,
# 4 orange, 5 purple, 6 cyan, 7 pink, 8 white, 9 charcoal), shape (orb |
# cube | diamond | coin), grants = a list of 1 to 4 tables, each one of
#   { kind = "stat", stat = "move_speed" | "max_hp" | "ammo_max" | "radius", mul, add }
#       stat = base x product of mul + sum of add over the live power-ups;
#       max_hp and ammo_max are integer stats: whole 'add' only, no 'mul'.
#       ammo_max also tops the ammo up by 'add' on every pickup.
#       radius (v0.34) is the contact radius: a mul in (0, 4], an add, or both.
#   { kind = "ability", slot = "dash" | "throw" | "ability", ability = "<ability name>" }
#       the slot runs that ability (any kind: buttons belong to slots) while live;
#       it switches when the slot is idle, its cooldown capped at the new def's.
#   { kind = "projectile", speed_mul, radius_mul, damage_add }
#       applied to each banana thrown while live and kept by that banana.
#   { kind = "tag", tag = "shielded" | "invulnerable" }
#       shielded absorbs one banana hit or dash attack, then the power-up ends.
# The same power-up picked up again restarts its timer.

[[powerup]]
name = "speed_boost"
duration_ticks = 480        # 8 s
color = 6                   # cyan
shape = "diamond"
grants = [{ kind = "stat", stat = "move_speed", mul = 1.5 }]

[[powerup]]
name = "big_banana"
duration_ticks = 600        # 10 s
color = 2                   # yellow
shape = "orb"
grants = [{ kind = "projectile", radius_mul = 2, speed_mul = 0.85 }]

[[powerup]]
name = "triple_banana"
duration_ticks = 900        # 15 s
color = 4                   # orange
shape = "coin"
grants = [{ kind = "stat", stat = "ammo_max", add = 2 }]

[[powerup]]
name = "shield"
duration_ticks = 900
color = 1                   # blue
shape = "orb"
grants = [{ kind = "tag", tag = "shielded" }]

[[powerup]]
name = "fast_hands"
duration_ticks = 600
color = 3                   # green
shape = "cube"
grants = [{ kind = "ability", slot = "throw", ability = "throw_fast" }]

# v0.34, the grid space (architecture §5.12). Quick Hands: the throw slot
# runs quick_throw (abilities.toml), which does not root, so the monkey can
# step and throw in one turn while it lasts. Spawned by the courtyard's
# spawners only (arenas/08-courtyard.toml).
[[powerup]]
name = "quick_hands"
duration_ticks = 600        # 40 turns of 15 ticks
color = 7                   # pink
shape = "cube"
grants = [{ kind = "ability", slot = "throw", ability = "quick_throw" }]

# The grid modes' baselines (modes.toml `baseline`: held from the spawn with
# no expiry; duration_ticks is required but never counted). They fit the hit
# disc inside a one-unit cell: a monkey of 0.35 (0.5 x 0.7) and a banana of
# 0.15 (0.35 x 0.4286, 9830 raw = 0.15 truncated) touch at 0.5, half a cell.
# HP 2, so one caught or missed banana does not swing the fight. No spawner
# lists them; a spawner without a power_ups list would draw them, so every
# spawner in the shipped arenas names its set.
[[powerup]]
name = "grid_base"
duration_ticks = 1
color = 8                   # white
shape = "orb"
grants = [
  { kind = "stat", stat = "radius", mul = 0.7 },
  { kind = "stat", stat = "max_hp", add = 1 },
  # 2 cells per 15-tick turn: 16 u/s x 0.5 = 8 u/s. The flight keeps
  # outbound_ticks (36): 4.8 cells out before it turns for home.
  { kind = "projectile", radius_mul = 0.4286, speed_mul = 0.5 },
]

# The same at 1-tick turns, grid_rounds_1t's. Its bananas keep the v0.34
# speed of 4 x 16 u/s = 64 u/s, about 1.07 cells per turn (the projectile
# speed limit was 4 until v0.80 made it 8); contest_base below flies them at
# 2 cells per turn.
[[powerup]]
name = "grid_base_1t"
duration_ticks = 1
color = 8
shape = "orb"
grants = [
  { kind = "stat", stat = "radius", mul = 0.7 },
  { kind = "stat", stat = "max_hp", add = 1 },
  { kind = "projectile", radius_mul = 0.4286, speed_mul = 4 },
]

# v0.80, the contest (architecture §11 "Contest design"): grid_base_1t with
# the banana at 2 cells per 1-tick turn, the 15-tick grid's speed: 16 u/s x
# 7.5 = 120 u/s (17476 raw per tick x 7.5 = 131070, 2 cells within the
# per-tick truncation). The contest row (modes.toml) also shortens the
# banana's flight out and sharpens its return to fit that speed.
[[powerup]]
name = "contest_base"
duration_ticks = 1
color = 8
shape = "orb"
grants = [
  { kind = "stat", stat = "radius", mul = 0.7 },
  { kind = "stat", stat = "max_hp", add = 1 },
  { kind = "projectile", radius_mul = 0.4286, speed_mul = 7.5 },
]

# v0.80, the contest's pickups (arenas/10-courtyard_zones.toml): the 1-tick
# twins of four power-ups, the same grants counted in 1-tick turns. A grant
# here does not depend on the turn's length (a projectile multiplier, an
# ammo top-up, a tag, an ability override), so only duration_ticks changes:
# half again the turns the 15-tick originals last (big_banana and
# quick_hands 40 turns, triple_banana and shield 60), so 60 and 90 turns, a
# quarter to three eighths of the spawners' 240-turn beat. On the contest's
# baseline a big banana flies at 7.5 x 0.85 = 6.375 (1.7 cells a turn) with
# a contact radius of 0.35 x 0.4286 x 2 = 0.30. quick_throw is shared with
# the 15-tick grid: it has no rooted phase at either turn length.
[[powerup]]
name = "big_banana_1t"
duration_ticks = 60         # 60 turns
color = 2
shape = "orb"
grants = [{ kind = "projectile", radius_mul = 2, speed_mul = 0.85 }]

[[powerup]]
name = "triplebanana_1t"
duration_ticks = 90         # 90 turns
color = 4
shape = "coin"
grants = [{ kind = "stat", stat = "ammo_max", add = 2 }]

[[powerup]]
name = "quick_hands_1t"
duration_ticks = 60         # 60 turns
color = 7
shape = "cube"
grants = [{ kind = "ability", slot = "throw", ability = "quick_throw" }]

[[powerup]]
name = "shield_1t"
duration_ticks = 90         # 90 turns (or the first hit it absorbs)
color = 1
shape = "orb"
grants = [{ kind = "tag", tag = "shielded" }]

# v0.82, the harvest contest's baseline (architecture §11 "Contest design:
# bananas as the economy"): contest_base with two more bananas in the hand,
# three in all, the banana still at 2 cells a turn. The hand is the cargo. A
# baseline's ammo_max raises the capacity without filling the hand (the
# top-up is a pickup's, rule 51), so a monkey still starts its match with
# [player] ammo_start and fills the rest at the trees.
[[powerup]]
name = "harvest_base"
duration_ticks = 1
color = 8
shape = "orb"
grants = [
  { kind = "stat", stat = "radius", mul = 0.7 },
  { kind = "stat", stat = "max_hp", add = 1 },
  { kind = "projectile", radius_mul = 0.4286, speed_mul = 7.5 },
  { kind = "stat", stat = "ammo_max", add = 2 },
]
