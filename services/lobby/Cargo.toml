[package]
name = "kfm-lobby"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Kung Fu Monkeys lobby service: room codes, tokens, the server registry and the WebRTC signaling relay (docs/lobby-protocol.md)"
publish = false

[[bin]]
name = "kfm-lobby"
path = "src/main.rs"

[features]
default = ["sentry"]
sentry = ["dep:sentry"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sentry = { version = "0.49", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.29"
